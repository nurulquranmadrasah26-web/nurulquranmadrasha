services:
  - type: web
    name: nurulquranmadrasha-backend
    runtime: node
    plan: free
    rootDir: nurulquranmadrasha/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SEED_SUPERADMIN_UID
        sync: false
      - key: SEED_SUPERADMIN_PASSWORD
        sync: false
      - key: SEED_SUPERADMIN_NAME
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
